server.port=8082
spring.application.name=ledger

# Quiet, fast startup: no banner, minimal web exposure beyond our controllers.
spring.main.banner-mode=off

# Expose actuator and prometheus endpoints
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Enable Micrometer Tracing trace propagation and export to OTLP
management.tracing.sampling.probability=1.0

# OTLP tracing configuration
management.otlp.tracing.endpoint=http://otel-collector:4317
